<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img">
  <title>Vertical storage bench</title>
  <desc>A weight bench standing upright, with a faint dashed outline of the bench in use.</desc>
  <rect width="320" height="220" fill="#fafaf9"/>
  <defs>
    <pattern id="bench-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0 H0 V20" fill="none" stroke="#e7e5e4" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="320" height="220" fill="url(#bench-grid)"/>
  <path d="M16 28 V14 H30" fill="none" stroke="#4f46e5" stroke-width="3"/>
  <rect x="28" y="36" width="264" height="160" fill="#fafaf9" fill-opacity="0.94"/>
  <line x1="36" y1="176" x2="284" y2="176" stroke="#1c1917" stroke-width="3"/>
  <rect x="48" y="148" width="120" height="18" rx="4" fill="none" stroke="#6366f1" stroke-width="2" stroke-dasharray="5 4"/>
  <rect x="168" y="58" width="12" height="118" fill="#1c1917"/>
  <rect x="154" y="70" width="36" height="86" rx="8" fill="#6366f1"/>
  <rect x="142" y="164" width="78" height="12" rx="2" fill="#1c1917"/>
</svg>
